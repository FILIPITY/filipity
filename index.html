<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>filipity</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b0f;
      --surface: #13131a;
      --border: #2a2a38;
      --text: #e8e8f0;
      --muted: #5a5a72;
      --discord: #5865f2;
      --kofi: #ff5e5b;
      --youtube: #ff0000;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Glowing orb */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(88,101,242,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.6s ease both;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 5.5rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 8px;
      position: relative;
    }

    .name::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: transparent;
      background: linear-gradient(135deg, var(--discord), var(--kofi));
      -webkit-background-clip: text;
      background-clip: text;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .name:hover::after { opacity: 1; }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--border);
      margin-bottom: 16px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
      animation: fadeUp 0.6s ease both;
      position: relative;
      overflow: hidden;
    }

    .link::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.2s ease;
      transform-origin: bottom;
    }

    .link:hover::before { transform: scaleY(1); }
    .link:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
      transform: translateX(4px);
    }

    .link:nth-child(1) { animation-delay: 0.1s; }
    .link:nth-child(2) { animation-delay: 0.2s; }
    .link:nth-child(3) { animation-delay: 0.3s; }

    .link--discord { --accent: var(--discord); }
    .link--kofi    { --accent: var(--kofi); }
    .link--youtube { --accent: var(--youtube); }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: var(--accent);
      transition: transform 0.2s;
    }

    .link:hover .icon { transform: scale(1.15); }

    .label { flex: 1; }

    .arrow {
      color: var(--muted);
      font-size: 1rem;
      transition: color 0.2s, transform 0.2s;
    }

    .link:hover .arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .footer {
      margin-top: 20px;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="name" data-text="filipity">filipity</h1>
    <div class="divider"></div>

    <!-- Discord -->

</html>
