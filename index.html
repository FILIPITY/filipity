<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 1.2rem 2rem;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="content">
        <h1>My Links</h1>
        <div class="links">
            <a href="#" class="link-btn">Link One</a>
            <a href="#" class="link-btn">Link Two</a>
            <a href="#" class="link-btn">Link Three</a>
            <a href="#" class="link-btn">Link Four</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let w, h, stars = [];
        let mx = 0, my = 0;
        let targetRotX = 0, targetRotY = 0;
        let rotX = 0, rotY = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * 2000 - 1000;
                this.y = Math.random() * 2000 - 1000;
                this.z = Math.random() * 2000;
                this.size = Math.random() * 2 + 0.5;
            }

            update() {
                this.z -= 2;
                if (this.z <= 0) {
                    this.reset();
                    this.z = 2000;
                }
            }

            draw() {
                const rotatedX = this.x * Math.cos(rotY) - this.z * Math.sin(rotY);
                const rotatedZ = this.x * Math.sin(rotY) + this.z * Math.cos(rotY);
                const rotatedY = this.y * Math.cos(rotX) - rotatedZ * Math.sin(rotX);
                const finalZ = this.y * Math.sin(rotX) + rotatedZ * Math.cos(rotX);

                if (finalZ <= 0) return;

                const scale = 1000 / finalZ;
                const x2d = rotatedX * scale + w / 2;
                const y2d = rotatedY * scale + h / 2;

                if (x2d < 0 || x2d > w || y2d < 0 || y2d > h) return;

                const size = this.size * scale;
                const opacity = Math.min(1, (2000 - finalZ) / 2000);

                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.beginPath();
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                ctx.fill();

                if (finalZ < 500) {
                    const px = this.x * Math.cos(rotY) - (this.z + 10) * Math.sin(rotY);
                    const pz = this.x * Math.sin(rotY) + (this.z + 10) * Math.cos(rotY);
                    const py = this.y * Math.cos(rotX) - pz * Math.sin(rotX);
                    const pfz = this.y * Math.sin(rotX) + pz * Math.cos(rotX);

                    if (pfz > 0) {
                        const pscale = 1000 / pfz;
                        const px2d = px * pscale + w / 2;
                        const py2d = py * pscale + h / 2;

                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                        ctx.lineWidth = size * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(px2d, py2d);
                        ctx.lineTo(x2d, y2d);
                        ctx.stroke();
                    }
                }
            }
        }

        function init() {
            resize();
            for (let i = 0; i < 800; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, w, h);

            rotX += (targetRotX - rotX) * 0.1;
            rotY += (targetRotY - rotY) * 0.1;

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mx = e.clientX;
            my = e.clientY;
            targetRotX = ((my / h) - 0.5) * 0.3;
            targetRotY = ((mx / w) - 0.5) * 0.3;
        });

        init();
        animate();
    </script>
</body>
</html>
